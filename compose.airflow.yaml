services:
  airflow-postgres:
    image: postgres:16
    container_name: ecommerce-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: ecommerce-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      ECOMMERCE_PROJECT_ROOT: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USERNAME}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname Local
        --lastname Admin
        --role Admin
        --email local@example.com || true

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: ecommerce-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: ecommerce-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

volumes:
  airflow-postgres-data: